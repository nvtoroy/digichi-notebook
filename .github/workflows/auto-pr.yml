name: Auto-PR
on:
  push:
    branches: ['digichi/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" --base main \
            --title "Подача: $GITHUB_REF_NAME" \
            --body "Авто-PR по push ветки submit-канала Тетради."